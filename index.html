<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KortexLumina AI</title>

  <!-- DISCORD EMBED / OPEN GRAPH META TAGY (Obdélníček na Discordu) -->
  <meta property="og:site_name" content="KortexLumina AI" />
  <meta property="og:title" content="KortexLumina AI — Chytrý Asistent & Chat" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://karnikyt.github.io/KortexLuminaAI/" />
  <meta property="og:description" content="Pokročilý AI chatovací asistent s generováním obrázků, skupinovým chatem, podporou pro mobily, PC, konzole i VR. Vyzkoušej zdarma!" />
  <meta property="og:image" content="https://karnikyt.github.io/KortexLuminaAI/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="theme-color" content="#818cf8" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #090d16;
      --sidebar-bg: rgba(15, 23, 42, 0.85);
      --card-bg: rgba(30, 41, 59, 0.65);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --accent-hover: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-blur: blur(24px);
      --shadow-glow: 0 0 25px rgba(129, 140, 248, 0.25);
    }

    body.theme-light {
      --bg-dark: #f1f5f9;
      --sidebar-bg: rgba(255, 255, 255, 0.9);
      --card-bg: rgba(241, 245, 249, 0.85);
      --card-border: rgba(0, 0, 0, 0.1);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);
    }

    body.theme-amoled {
      --bg-dark: #000000;
      --sidebar-bg: #050505;
      --card-bg: #121212;
      --card-border: #222222;
      --text-main: #ffffff;
      --text-muted: #888888;
      --shadow-glow: 0 0 15px rgba(168, 85, 247, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; transition: background 0.3s, color 0.3s; }

    :focus-visible { outline: 3px solid #a855f7 !important; outline-offset: 2px; }

    .glass { background: var(--card-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--card-border); }

    /* PŘIHLÁŠENÍ */
    #auth-container {
      position: fixed; inset: 0; background: rgba(9, 13, 22, 0.92); backdrop-filter: blur(30px); z-index: 2000;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-box { 
      width: 100%; max-width: 420px; padding: 36px; border-radius: 28px; text-align: center; 
      display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow-glow);
    }
    .auth-box h2 { font-size: 2.2rem; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .auth-box input { 
      padding: 14px 18px; border-radius: 14px; border: 1px solid var(--card-border); 
      background: rgba(15, 23, 42, 0.6); color: var(--text-main); outline: none; font-size: 1rem;
      transition: all 0.3s ease;
    }
    .auth-box input:focus { border-color: #818cf8; box-shadow: 0 0 12px rgba(129, 140, 248, 0.3); }

    /* TLAČÍTKA */
    .btn {
      min-height: 50px; padding: 12px 20px; background: var(--accent-gradient); color: white; border: none; border-radius: 14px;
      cursor: pointer; font-weight: 600; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 10px; 
      transition: all 0.25s ease; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }
    .btn:hover, .btn:focus { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45); }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--card-border); color: var(--text-main); box-shadow: none; }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }
    .btn-google { background: #ffffff; color: #0f172a; font-weight: 700; box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15); }
    .btn-google:hover { background: #f8fafc; }

    /* SIDEBAR */
    #sidebar {
      width: 290px; background: var(--sidebar-bg); backdrop-filter: var(--glass-blur); display: flex; flex-direction: column; 
      border-right: 1px solid var(--card-border); padding: 18px; gap: 12px; z-index: 1000; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #sidebar.collapsed { width: 0px; padding: 0px; overflow: hidden; border-right: none; }

    .sidebar-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .icon-btn {
      min-width: 42px; height: 42px; background: transparent; border: none; color: var(--text-main); font-size: 1.2rem; 
      cursor: pointer; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: background 0.2s;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.1); }

    .section-title { font-size: 0.75rem; color: var(--text-muted); font-weight: 800; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .list-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .item-btn {
      min-height: 46px; padding: 10px 14px; border-radius: 12px; background: transparent; color: var(--text-main);
      text-align: left; border: none; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 0.95rem; transition: background 0.2s;
    }
    .item-btn:hover, .item-btn:focus { background: rgba(255, 255, 255, 0.1); }

    /* MAIN CONTENT */
    #main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; width: 100%; }
    #chat-header {
      min-height: 64px; padding: 10px 24px; border-bottom: 1px solid var(--card-border); display: flex;
      justify-content: space-between; align-items: center; background: var(--sidebar-bg); backdrop-filter: var(--glass-blur);
    }

    /* IDOS PROFILOVE MENU */
    .profile-area { position: relative; }
    .profile-avatar-btn {
      width: 44px; height: 44px; border-radius: 50%; background: var(--accent-gradient); color: white;
      border: 2px solid var(--card-border); cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
    }
    .idos-profile-card {
      position: absolute; right: 0; top: 56px; width: 290px; background: var(--sidebar-bg); backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px;
      box-shadow: var(--shadow-glow); z-index: 1100;
    }
    .idos-user-info { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--card-border); padding-bottom: 14px; }
    .idos-user-info .email { font-size: 0.85rem; color: var(--text-main); font-weight: 600; word-break: break-all; }
    .idos-user-info .badge { font-size: 0.7rem; background: #a855f7; color: white; padding: 2px 8px; border-radius: 6px; font-weight: bold; width: fit-content; margin-top: 4px; }

    .menu-group { display: flex; flex-direction: column; gap: 6px; }
    .menu-group label { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; }
    .menu-group select { padding: 10px; border-radius: 10px; background: var(--card-bg); color: var(--text-main); border: 1px solid var(--card-border); outline: none; }

    /* CHAT ZPRÁVY */
    #messages-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: 80%; padding: 14px 20px; border-radius: 18px; line-height: 1.6; font-size: 0.98rem; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .message.user { align-self: flex-end; background: var(--accent-gradient); color: white; border-bottom-right-radius: 4px; }
    .message.ai { align-self: flex-start; background: var(--card-bg); border: 1px solid var(--card-border); border-bottom-left-radius: 4px; }
    .message .sender { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 700; }
    .message img.generated-img { max-width: 100%; border-radius: 14px; margin-top: 10px; display: block; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }

    /* INPUT BAR */
    #input-form { padding: 16px 20px; background: var(--sidebar-bg); border-top: 1px solid var(--card-border); display: flex; gap: 12px; }
    #message-input { 
      flex: 1; min-height: 50px; padding: 14px 20px; border-radius: 14px; border: 1px solid var(--card-border); 
      background: var(--card-bg); color: var(--text-main); outline: none; font-size: 1rem; transition: all 0.3s;
    }
    #message-input:focus { border-color: #818cf8; box-shadow: 0 0 12px rgba(129, 140, 248, 0.25); }

    @media (max-width: 768px) {
      #sidebar { position: fixed; inset: 0 auto 0 0; width: 85%; max-width: 320px; transform: translateX(0); }
      #sidebar.collapsed { transform: translateX(-100%); width: 85%; }
      .message { max-width: 92%; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- PŘIHLÁŠENÍ -->
  <div id="auth-container">
    <div class="auth-box glass">
      <h2>KortexLumina AI</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;" id="txt-auth-sub">Přihlaste se ke svému účtu</p>

      <button class="btn btn-google" id="btn-google">
        <i class="fa-brands fa-google"></i> Přihlásit přes Google
      </button>

      <div style="color: var(--text-muted); font-size: 0.8rem;">nebo e-mailem</div>

      <input type="email" id="auth-email" placeholder="E-mail">
      <input type="password" id="auth-password" placeholder="Heslo">
      
      <button class="btn" id="btn-login"><i class="fa-solid fa-right-to-bracket"></i> Přihlásit se</button>
      <button class="btn btn-secondary" id="btn-register"><i class="fa-solid fa-user-plus"></i> Registrovat</button>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-header">
      <button class="btn" id="btn-new-chat" style="flex:1;"><i class="fa-solid fa-plus"></i> <span id="lbl-new-chat">Nový chat</span></button>
      <button class="icon-btn" id="btn-close-sidebar" title="Zavřít panel"><i class="fa-solid fa-xmark"></i></button>
    </div>
    
    <button class="btn btn-secondary" id="btn-new-group"><i class="fa-solid fa-users"></i> <span id="lbl-new-group">Skupinový chat</span></button>

    <div class="section-title" id="txt-chats-title">Chaty & Skupiny</div>
    <div class="list-container" id="chats-list"></div>
  </div>

  <!-- MAIN CONTENT -->
  <div id="main-content">
    <div id="chat-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="icon-btn" id="btn-toggle-sidebar" title="Otevřít / Zavřít sidebar"><i class="fa-solid fa-bars"></i></button>
        <h3 id="current-chat-title" style="font-weight: 700;">KortexLumina AI</h3>
      </div>

      <!-- IDOS PROFILOVÉ MENU -->
      <div class="profile-area">
        <button class="profile-avatar-btn" id="btn-profile"><i class="fa-solid fa-user"></i></button>
        
        <div class="idos-profile-card hidden" id="idos-profile-dropdown">
          <div class="idos-user-info">
            <div class="profile-avatar-btn" style="pointer-events: none;"><i class="fa-solid fa-user-astronaut"></i></div>
            <div style="display: flex; flex-direction: column;">
              <span class="email" id="user-email-display">uzivatel@email.cz</span>
              <span class="badge hidden" id="owner-badge"><i class="fa-solid fa-crown"></i> Majitel</span>
            </div>
          </div>

          <div class="menu-group">
            <label for="lang-select" id="txt-lang-label">Jazyk / Language:</label>
            <select id="lang-select">
              <option value="cs">Čeština</option>
              <option value="en">English</option>
            </select>
          </div>

          <div class="menu-group">
            <label for="theme-select" id="txt-theme-label">Vzhled / Theme:</label>
            <select id="theme-select">
              <option value="dark">Tmavý (Dark)</option>
              <option value="light">Světlý (Light)</option>
              <option value="amoled">OLED Černý</option>
            </select>
          </div>

          <button class="btn btn-secondary" id="btn-share-group" style="display:none; font-size:0.85rem;"><i class="fa-solid fa-user-plus"></i> Pozvat e-mailem</button>
          <button class="btn btn-secondary" id="btn-logout" style="margin-top: 5px;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Odhlásit se</button>
        </div>
      </div>
    </div>

    <div id="messages-container"></div>

    <form id="input-form">
      <input type="text" id="message-input" placeholder="Napište zprávu nebo 'nakresli [popis]'..." autocomplete="off" disabled>
      <button type="submit" class="btn" id="btn-send" style="width: auto;" disabled><i class="fa-solid fa-paper-plane"></i></button>
    </form>
  </div>

  <!-- FIREBASE & LOGIKA -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut, 
      GoogleAuthProvider, 
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, onSnapshot, orderBy, serverTimestamp, doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBaJOEG6PsvBpkDb0Jn44Qq85aJi2syMP4",
      authDomain: "kortexlumina.firebaseapp.com",
      projectId: "kortexlumina",
      storageBucket: "kortexlumina.firebasestorage.app",
      messagingSenderId: "818404499355",
      appId: "1:818404499355:web:d162b94862d5fae81d4b3e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // 1. OPRAVA PŘIHLÁŠENÍ: Trvalé ukládání do localStorage pro zabránění ztrátě stavu
    setPersistence(auth, browserLocalPersistence).catch(console.error);

    // Zpracování návratu z přesměrování (Google Redirect)
    getRedirectResult(auth).catch(err => console.error("Redirect login err:", err));

    const OPENROUTER_API_KEY = "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";
    const OWNER_EMAIL = "milovnikmhd@gmail.com";

    let currentUser = null;
    let currentChatId = null;
    let currentChatData = null;
    let unsubscribeMessages = null;

    // Ovládání sidebaru
    const sidebar = document.getElementById('sidebar');
    const toggleSidebar = () => sidebar.classList.toggle('collapsed');
    document.getElementById('btn-toggle-sidebar').onclick = toggleSidebar;
    document.getElementById('btn-close-sidebar').onclick = toggleSidebar;

    // Jazyky & Vzhled
    let currentLang = 'cs';
    const dict = {
      cs: { newChat: "Nový chat", newGroup: "Skupinový chat", chats: "Chaty & Skupiny", placeholder: "Napište zprávu nebo 'nakresli...'", logout: "Odhlásit se", fillEmail: "Zadejte platný e-mail a heslo." },
      en: { newChat: "New Chat", newGroup: "Group Chat", chats: "Chats & Groups", placeholder: "Type a message or 'draw...'", logout: "Log out", fillEmail: "Please enter valid email and password." }
    };

    document.getElementById('lang-select').addEventListener('change', (e) => {
      currentLang = e.target.value;
      document.getElementById('lbl-new-chat').textContent = dict[currentLang].newChat;
      document.getElementById('lbl-new-group').textContent = dict[currentLang].newGroup;
      document.getElementById('txt-chats-title').textContent = dict[currentLang].chats;
      document.getElementById('message-input').placeholder = dict[currentLang].placeholder;
    });

    document.getElementById('theme-select').addEventListener('change', (e) => {
      document.body.className = '';
      if (e.target.value !== 'dark') document.body.classList.add(`theme-${e.target.value}`);
    });

    document.getElementById('btn-profile').onclick = () => {
      document.getElementById('idos-profile-dropdown').classList.toggle('hidden');
    };

    // OPRAVENÉ GOOGLE PŘIHLÁŠENÍ (S automatickým přesměrováním při selhání SessionStorage)
    document.getElementById('btn-google').onclick = () => {
      signInWithPopup(auth, googleProvider).catch((error) => {
        if (error.code === 'auth/web-storage-unsupported' || error.message.includes('missing initial state')) {
          // Pokud browser blokuje Popup Storage, použije se záložní přesměrování
          signInWithRedirect(auth, googleProvider);
        } else {
          alert("Chyba přihlášení: " + error.message);
        }
      });
    };

    function validateInput() {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-password').value;
      if (!email || !email.includes('@') || !pass) { alert(dict[currentLang].fillEmail); return false; }
      return { email, pass };
    }

    document.getElementById('btn-login').onclick = () => { const v = validateInput(); if(v) signInWithEmailAndPassword(auth, v.email, v.pass).catch(e => alert(e.message)); };
    document.getElementById('btn-register').onclick = () => { const v = validateInput(); if(v) createUserWithEmailAndPassword(auth, v.email, v.pass).catch(e => alert(e.message)); };
    document.getElementById('btn-logout').onclick = () => { signOut(auth); document.getElementById('idos-profile-dropdown').classList.add('hidden'); };

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById('auth-container').classList.add('hidden');
        document.getElementById('user-email-display').textContent = user.email;
        
        if (user.email.toLowerCase() === OWNER_EMAIL) {
          document.getElementById('owner-badge').classList.remove('hidden');
        } else {
          document.getElementById('owner-badge').classList.add('hidden');
        }

        loadChats();
      } else {
        document.getElementById('auth-container').classList.remove('hidden');
        document.getElementById('chats-list').innerHTML = '';
        document.getElementById('messages-container').innerHTML = '';
      }
    });

    // CHATY & SKUPINY
    async function createChat(type = 'direct') {
      const title = prompt(type === 'group' ? "Název skupinového chatu:" : "Název nového chatu:");
      if (!title) return;

      const docRef = await addDoc(collection(db, "chats"), {
        title: title,
        type: type,
        owner: currentUser.email,
        members: [currentUser.email],
        createdAt: serverTimestamp()
      });
      selectChat(docRef.id, { title, type, members: [currentUser.email] });
    }

    document.getElementById('btn-new-chat').onclick = () => createChat('direct');
    document.getElementById('btn-new-group').onclick = () => createChat('group');

    function loadChats() {
      const q = query(collection(db, "chats"), where("members", "array-contains", currentUser.email));
      onSnapshot(q, (snapshot) => {
        const list = document.getElementById('chats-list');
        list.innerHTML = '';
        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          const btn = document.createElement('button');
          btn.className = 'item-btn';
          btn.innerHTML = `<i class="fa-regular ${data.type === 'group' ? 'fa-comments' : 'fa-message'}"></i> ${data.title}`;
          btn.onclick = () => {
            selectChat(docSnap.id, data);
            if (window.innerWidth <= 768) sidebar.classList.add('collapsed');
          };
          list.appendChild(btn);
        });
      });
    }

    function selectChat(chatId, data) {
      currentChatId = chatId;
      currentChatData = data;
      document.getElementById('current-chat-title').textContent = data.title;
      document.getElementById('message-input').disabled = false;
      document.getElementById('btn-send').disabled = false;

      const shareBtn = document.getElementById('btn-share-group');
      if (data.type === 'group') {
        shareBtn.style.display = 'flex';
        shareBtn.onclick = () => inviteUser(chatId);
      } else {
        shareBtn.style.display = 'none';
      }

      listenMessages(chatId);
    }

    async function inviteUser(chatId) {
      const email = prompt("Zadejte e-mail kamaráda pro přidání do skupiny:");
      if (!email || !email.includes('@')) return;
      await updateDoc(doc(db, "chats", chatId), { members: arrayUnion(email.trim()) });
      alert("Kamarád byl úspěšně přidán!");
    }

    function listenMessages(chatId) {
      if (unsubscribeMessages) unsubscribeMessages();
      const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"));
      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        const container = document.getElementById('messages-container');
        container.innerHTML = '';
        snapshot.forEach(docSnap => {
          const msg = docSnap.data();
          const div = document.createElement('div');
          div.className = `message ${msg.sender === currentUser.email ? 'user' : 'ai'}`;
          div.innerHTML = `<div class="sender">${msg.sender}</div>${msg.text}`;
          container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    // ODESÍLÁNÍ ZPRÁV A AI
    document.getElementById('input-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentChatId) return;

      input.value = '';
      await addDoc(collection(db, "chats", currentChatId, "messages"), {
        sender: currentUser.email,
        text: text,
        createdAt: serverTimestamp()
      });

      const lowerText = text.toLowerCase();
      if (lowerText.startsWith("nakresli ") || lowerText.startsWith("draw ") || lowerText.startsWith("vytvoř obrázek ")) {
        generateImage(text);
      } else if (currentChatData.type === 'direct' || lowerText.includes('@ai')) {
        callAI(text);
      }
    };

    async function callAI(promptText) {
      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
            "Content-Type": "application/json",
            "HTTP-Referer": window.location.href,
            "X-Title": "KortexLumina AI"
          },
          body: JSON.stringify({
            model: "meta-llama/llama-3.3-70b-instruct:free",
            messages: [{ role: "user", content: promptText }]
          })
        });

        const data = await response.json();
        let reply = "Omlouvám se, ale AI neposkytla odpověď.";
        if (data.choices && data.choices[0] && data.choices[0].message) {
          reply = data.choices[0].message.content;
        }

        await addDoc(collection(db, "chats", currentChatId, "messages"), {
          sender: "KortexLumina AI",
          text: reply,
          createdAt: serverTimestamp()
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function generateImage(promptText) {
      const cleanPrompt = encodeURIComponent(promptText.replace(/^(nakresli|draw|vytvoř obrázek)\s+/i, ''));
      const imageUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?width=800&height=600&nologo=true`;
      
      const imgHTML = `<br><img src="${imageUrl}" class="generated-img" alt="Vygenerovaný obrázek" loading="lazy">`;

      await addDoc(collection(db, "chats", currentChatId, "messages"), {
        sender: "KortexLumina AI (Art)",
        text: `Zde je tvůj obrázek pro: <b>${promptText}</b>${imgHTML}`,
        createdAt: serverTimestamp()
      });
    }
  </script>
</body>
</html>
