<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KortexLumina AI</title>

  <!-- Meta Tagy pro Discord & Web -->
  <meta property="og:title" content="KortexLumina AI" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://karnikyt.github.io/KortexLuminaAI/" />
  <meta property="og:description" content="Chytrý AI asistent s podporou chatu, skupin, projektů a optimalizací pro PC, konzole i VR." />
  <meta property="og:image" content="https://karnikyt.github.io/KortexLuminaAI/og-image.png" />
  <meta name="theme-color" content="#6366f1" />

  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0f172a;
      --sidebar-bg: rgba(15, 23, 42, 0.95);
      --card-bg: rgba(30, 41, 59, 0.8);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --accent-hover: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-blur: blur(20px);
    }

    /* Vzhledové motivy */
    body.theme-light {
      --bg-dark: #f1f5f9;
      --sidebar-bg: rgba(255, 255, 255, 0.95);
      --card-bg: rgba(241, 245, 249, 0.9);
      --card-border: rgba(0, 0, 0, 0.1);
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    body.theme-amoled {
      --bg-dark: #000000;
      --sidebar-bg: #050505;
      --card-bg: #101010;
      --card-border: #222222;
      --text-main: #ffffff;
      --text-muted: #888888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; transition: background 0.3s, color 0.3s; }

    /* Podpora pro konzole a VR - zvýraznění při navigaci klávesnicí/gamepadem */
    :focus-visible { outline: 3px solid #a855f7 !important; outline-offset: 2px; }

    /* Glassmorphism */
    .glass { background: var(--card-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--card-border); }

    /* Prihlaseni */
    #auth-container {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(25px); z-index: 2000;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-box { width: 100%; max-width: 400px; padding: 30px; border-radius: 24px; text-align: center; display: flex; flex-direction: column; gap: 14px; }
    .auth-box h2 { font-size: 1.8rem; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .auth-box input { padding: 14px; border-radius: 12px; border: 1px solid var(--card-border); background: rgba(15, 23, 42, 0.6); color: var(--text-main); outline: none; font-size: 1rem; }

    /* Tlacitka pro VR / Mobil touch (min. 44px vyska) */
    .btn {
      min-height: 48px; padding: 12px 18px; background: var(--accent-gradient); color: white; border: none; border-radius: 12px;
      cursor: pointer; font-weight: 600; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform 0.2s;
    }
    .btn:hover, .btn:focus { transform: scale(1.02); }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--card-border); color: var(--text-main); }
    .btn-google { background: #ffffff; color: #0f172a; font-weight: 700; }

    /* Postranní panel */
    #sidebar {
      width: 280px; background: var(--sidebar-bg); display: flex; flex-direction: column; border-right: 1px solid var(--card-border); padding: 16px; gap: 10px; z-index: 1000;
      transition: transform 0.3s ease;
    }
    .section-title { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; margin-top: 10px; text-transform: uppercase; }
    .list-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .item-btn {
      min-height: 44px; padding: 10px 14px; border-radius: 10px; background: transparent; color: var(--text-main);
      text-align: left; border: none; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 0.95rem;
    }
    .item-btn:hover, .item-btn:focus { background: rgba(255, 255, 255, 0.1); }

    /* Hlavní panel */
    #main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
    #chat-header {
      min-height: 60px; padding: 10px 20px; border-bottom: 1px solid var(--card-border); display: flex;
      justify-content: space-between; align-items: center; background: var(--sidebar-bg);
    }

    /* IDOS profilove menu */
    .profile-area { position: relative; }
    .profile-avatar-btn {
      width: 44px; height: 44px; border-radius: 50%; background: var(--accent-gradient); color: white;
      border: 2px solid var(--card-border); cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold;
    }
    .idos-profile-card {
      position: absolute; right: 0; top: 55px; width: 280px; background: var(--sidebar-bg); backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1100;
    }
    .idos-user-info { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; }
    .idos-user-info .email { font-size: 0.85rem; color: var(--text-main); font-weight: 600; word-break: break-all; }
    .idos-user-info .badge { font-size: 0.7rem; background: #a855f7; color: white; padding: 2px 6px; border-radius: 6px; font-weight: bold; width: fit-content; margin-top: 2px; }

    .menu-group { display: flex; flex-direction: column; gap: 4px; }
    .menu-group label { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; }
    .menu-group select { padding: 8px; border-radius: 8px; background: var(--card-bg); color: var(--text-main); border: 1px solid var(--card-border); outline: none; }

    /* Chat zpravy */
    #messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .message { max-width: 85%; padding: 12px 18px; border-radius: 16px; line-height: 1.5; font-size: 0.95rem; }
    .message.user { align-self: flex-end; background: var(--accent-gradient); color: white; border-bottom-right-radius: 4px; }
    .message.ai { align-self: flex-start; background: var(--card-bg); border: 1px solid var(--card-border); border-bottom-left-radius: 4px; }
    .message .sender { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }

    /* Vstupni pole pro mobily/VR */
    #input-form { padding: 14px; background: var(--sidebar-bg); border-top: 1px solid var(--card-border); display: flex; gap: 10px; }
    #message-input { flex: 1; min-height: 48px; padding: 12px 18px; border-radius: 12px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-main); outline: none; font-size: 1rem; }

    /* Mobilni rozvrzeni & burger menu */
    #mobile-menu-btn { display: none; background: transparent; border: none; color: var(--text-main); font-size: 1.4rem; cursor: pointer; padding: 5px; }
    
    @media (max-width: 768px) {
      #sidebar { position: fixed; inset: 0 auto 0 0; transform: translateX(-100%); width: 80%; max-width: 300px; }
      #sidebar.active { transform: translateX(0); }
      #mobile-menu-btn { display: block; }
      .message { max-width: 90%; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- PRIHLASENI -->
  <div id="auth-container">
    <div class="auth-box glass">
      <h2>KortexLumina AI</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem;" id="txt-auth-sub">Přihlaste se ke svému účtu</p>

      <button class="btn btn-google" id="btn-google" tabindex="1">
        <i class="fa-brands fa-google"></i> Přihlásit přes Google
      </button>

      <div style="color: var(--text-muted); font-size: 0.8rem;">nebo e-mailem</div>

      <input type="email" id="auth-email" placeholder="E-mail" tabindex="2">
      <input type="password" id="auth-password" placeholder="Heslo" tabindex="3">
      
      <button class="btn" id="btn-login" tabindex="4"><i class="fa-solid fa-right-to-bracket"></i> Přihlásit se</button>
      <button class="btn btn-secondary" id="btn-register" tabindex="5"><i class="fa-solid fa-user-plus"></i> Registrovat</button>
    </div>
  </div>

  <!-- POSTRANNI PANEL -->
  <div id="sidebar">
    <button class="btn" id="btn-new-chat"><i class="fa-solid fa-plus"></i> <span id="lbl-new-chat">Nový chat</span></button>
    <button class="btn btn-secondary" id="btn-new-group"><i class="fa-solid fa-users"></i> <span id="lbl-new-group">Skupinový chat</span></button>

    <div class="section-title" id="txt-chats-title">Chaty & Skupiny</div>
    <div class="list-container" id="chats-list"></div>
  </div>

  <!-- HLAVNI OBSAH -->
  <div id="main-content">
    <div id="chat-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button id="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
        <h3 id="current-chat-title" style="font-weight: 600;">KortexLumina AI</h3>
      </div>

      <!-- IDOS PROFILOVE MENU -->
      <div class="profile-area">
        <button class="profile-avatar-btn" id="btn-profile"><i class="fa-solid fa-user"></i></button>
        
        <div class="idos-profile-card hidden" id="idos-profile-dropdown">
          <div class="idos-user-info">
            <div class="profile-avatar-btn" style="pointer-events: none;"><i class="fa-solid fa-user-astronaut"></i></div>
            <div style="display: flex; flex-direction: column;">
              <span class="email" id="user-email-display">uzivatel@email.cz</span>
              <span class="badge hidden" id="owner-badge"><i class="fa-solid fa-crown"></i> Majitel</span>
            </div>
          </div>

          <div class="menu-group">
            <label for="lang-select" id="txt-lang-label">Jazyk / Language:</label>
            <select id="lang-select">
              <option value="cs">Čeština</option>
              <option value="en">English</option>
            </select>
          </div>

          <div class="menu-group">
            <label for="theme-select" id="txt-theme-label">Vzhled / Theme:</label>
            <select id="theme-select">
              <option value="dark">Tmavý (Dark)</option>
              <option value="light">Světlý (Light)</option>
              <option value="amoled">OLED Černý</option>
            </select>
          </div>

          <button class="btn btn-secondary" id="btn-share-group" style="display:none; font-size:0.85rem;"><i class="fa-solid fa-user-plus"></i> Pozvat e-mailem</button>
          <button class="btn btn-secondary" id="btn-logout" style="margin-top: 5px;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Odhlásit se</button>
        </div>
      </div>
    </div>

    <div id="messages-container"></div>

    <form id="input-form">
      <input type="text" id="message-input" placeholder="Napište zprávu..." autocomplete="off" disabled>
      <button type="submit" class="btn" id="btn-send" style="width: auto;" disabled><i class="fa-solid fa-paper-plane"></i></button>
    </form>
  </div>

  <!-- FIREBASE & APPLIKACNI LOGIKA -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, onSnapshot, orderBy, serverTimestamp, doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBaJOEG6PsvBpkDb0Jn44Qq85aJi2syMP4",
      authDomain: "kortexlumina.firebaseapp.com",
      projectId: "kortexlumina",
      storageBucket: "kortexlumina.firebasestorage.app",
      messagingSenderId: "818404499355",
      appId: "1:818404499355:web:d162b94862d5fae81d4b3e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    const OPENROUTER_API_KEY = "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";
    const OWNER_EMAIL = "milovnikmhd@gmail.com";

    let currentUser = null;
    let currentChatId = null;
    let currentChatData = null;
    let unsubscribeMessages = null;

    // Mobilni menu toggle
    const sidebar = document.getElementById('sidebar');
    document.getElementById('mobile-menu-btn').onclick = () => sidebar.classList.toggle('active');

    // Jazyky a Nastaveni Vzhledu
    let currentLang = 'cs';
    const dict = {
      cs: { newChat: "Nový chat", newGroup: "Skupinový chat", chats: "Chaty & Skupiny", placeholder: "Napište zprávu...", logout: "Odhlásit se", fillEmail: "Zadejte platný e-mail a heslo." },
      en: { newChat: "New Chat", newGroup: "Group Chat", chats: "Chats & Groups", placeholder: "Type a message...", logout: "Log out", fillEmail: "Please enter valid email and password." }
    };

    document.getElementById('lang-select').addEventListener('change', (e) => {
      currentLang = e.target.value;
      document.getElementById('lbl-new-chat').textContent = dict[currentLang].newChat;
      document.getElementById('lbl-new-group').textContent = dict[currentLang].newGroup;
      document.getElementById('txt-chats-title').textContent = dict[currentLang].chats;
      document.getElementById('message-input').placeholder = dict[currentLang].placeholder;
    });

    document.getElementById('theme-select').addEventListener('change', (e) => {
      document.body.className = '';
      if (e.target.value !== 'dark') document.body.classList.add(`theme-${e.target.value}`);
    });

    document.getElementById('btn-profile').onclick = () => {
      document.getElementById('idos-profile-dropdown').classList.toggle('hidden');
    };

    // Autentizace
    function validateInput() {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-password').value;
      if (!email || !email.includes('@') || !pass) { alert(dict[currentLang].fillEmail); return false; }
      return { email, pass };
    }

    document.getElementById('btn-google').onclick = () => signInWithPopup(auth, googleProvider).catch(e => alert(e.message));
    document.getElementById('btn-login').onclick = () => { const v = validateInput(); if(v) signInWithEmailAndPassword(auth, v.email, v.pass).catch(e => alert(e.message)); };
    document.getElementById('btn-register').onclick = () => { const v = validateInput(); if(v) createUserWithEmailAndPassword(auth, v.email, v.pass).catch(e => alert(e.message)); };
    document.getElementById('btn-logout').onclick = () => { signOut(auth); document.getElementById('idos-profile-dropdown').classList.add('hidden'); };

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById('auth-container').classList.add('hidden');
        document.getElementById('user-email-display').textContent = user.email;
        
        // Zobrazit odznak majitele pro milovnikmhd@gmail.com
        if (user.email.toLowerCase() === OWNER_EMAIL) {
          document.getElementById('owner-badge').classList.remove('hidden');
        } else {
          document.getElementById('owner-badge').classList.add('hidden');
        }

        loadChats();
      } else {
        document.getElementById('auth-container').classList.remove('hidden');
        document.getElementById('chats-list').innerHTML = '';
        document.getElementById('messages-container').innerHTML = '';
      }
    });

    // Vytvoreni soukromeho nebo skupinoveho chatu
    async function createChat(type = 'direct') {
      const title = prompt(type === 'group' ? "Název skupinového chatu:" : "Název nového chatu:");
      if (!title) return;

      const docRef = await addDoc(collection(db, "chats"), {
        title: title,
        type: type,
        owner: currentUser.email,
        members: [currentUser.email],
        createdAt: serverTimestamp()
      });
      selectChat(docRef.id, { title, type, members: [currentUser.email] });
    }

    document.getElementById('btn-new-chat').onclick = () => createChat('direct');
    document.getElementById('btn-new-group').onclick = () => createChat('group');

    // Nacteni chatů a skupin
    function loadChats() {
      const q = query(collection(db, "chats"), where("members", "array-contains", currentUser.email));
      onSnapshot(q, (snapshot) => {
        const list = document.getElementById('chats-list');
        list.innerHTML = '';
        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          const btn = document.createElement('button');
          btn.className = 'item-btn';
          btn.innerHTML = `<i class="fa-regular ${data.type === 'group' ? 'fa-comments' : 'fa-message'}"></i> ${data.title}`;
          btn.onclick = () => {
            selectChat(docSnap.id, data);
            sidebar.classList.remove('active');
          };
          list.appendChild(btn);
        });
      });
    }

    // Vyber chatu a pozvani pomoci e-mailu
    function selectChat(chatId, data) {
      currentChatId = chatId;
      currentChatData = data;
      document.getElementById('current-chat-title').textContent = data.title;
      document.getElementById('message-input').disabled = false;
      document.getElementById('btn-send').disabled = false;

      const shareBtn = document.getElementById('btn-share-group');
      if (data.type === 'group') {
        shareBtn.style.display = 'flex';
        shareBtn.onclick = () => inviteUser(chatId);
      } else {
        shareBtn.style.display = 'none';
      }

      listenMessages(chatId);
    }

    async function inviteUser(chatId) {
      const email = prompt("Zadejte e-mail kamaráda pro přidání do skupiny:");
      if (!email || !email.includes('@')) return;
      await updateDoc(doc(db, "chats", chatId), { members: arrayUnion(email.trim()) });
      alert("Kamarád byl úspěšně přidán!");
    }

    // Zpravy
    function listenMessages(chatId) {
      if (unsubscribeMessages) unsubscribeMessages();
      const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"));
      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        const container = document.getElementById('messages-container');
        container.innerHTML = '';
        snapshot.forEach(docSnap => {
          const msg = docSnap.data();
          const div = document.createElement('div');
          div.className = `message ${msg.sender === currentUser.email ? 'user' : 'ai'}`;
          div.innerHTML = `<div class="sender">${msg.sender}</div>${msg.text}`;
          container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    document.getElementById('input-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentChatId) return;

      input.value = '';
      await addDoc(collection(db, "chats", currentChatId, "messages"), {
        sender: currentUser.email,
        text: text,
        createdAt: serverTimestamp()
      });

      // AI odpovida automaticky v soukromem chatu nebo ve skupine na @ai
      if (currentChatData.type === 'direct' || text.toLowerCase().includes('@ai')) {
        callAI(text);
      }
    };

    async function callAI(prompt) {
      try {
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: { "Authorization": `Bearer ${OPENROUTER_API_KEY}`, "Content-Type": "application/json" },
          body: JSON.stringify({ model: "deepseek/deepseek-r1:free", messages: [{ role: "user", content: prompt }] })
        });
        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content || "Odpověď se nepodařilo vygenerovat.";
        await addDoc(collection(db, "chats", currentChatId, "messages"), {
          sender: "KortexLumina AI",
          text: reply,
          createdAt: serverTimestamp()
        });
      } catch (err) { console.error(err); }
    }
  </script>
</body>
</html>
